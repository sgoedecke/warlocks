<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warlocks procedural icons</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; background: #08070a radial-gradient(circle at top, #302010, #08070a 45rem); color: #e9dec7; }
    main { padding: 24px; }
    h1 { margin: 0 0 4px; font-size: 28px; }
    p { margin: 0 0 20px; color: #c7b897; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(164px, 1fr)); gap: 14px; }
    .card { background: linear-gradient(#241c14, #100d0b); border: 1px solid #4d3b24; border-radius: 8px; padding: 10px; box-shadow: inset 0 1px rgba(255,255,255,.08), 0 8px 24px rgba(0,0,0,.35); }
    .icons { display: flex; align-items: end; gap: 10px; min-height: 72px; }
    img { image-rendering: auto; box-shadow: 0 0 0 1px #000, 0 0 18px rgba(255,190,80,.12); }
    .label { margin-top: 8px; font-weight: 700; font-size: 13px; color: #ffe5a6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .path { margin-top: 3px; font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; color: #8f826c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    section { margin-bottom: 24px; }
    h2 { margin: 20px 0 10px; color: #ffd27a; font-size: 18px; }
  </style>
</head>
<body>
  <main>
    <h1>Warlocks open procedural icons</h1>
    <p>Each command button is rendered from deterministic canvas code at 64px and 32px.</p>
    <div id="root"></div>
  </main>
  <script type="module" src="./icons.ts"></script>
</body>
</html>
