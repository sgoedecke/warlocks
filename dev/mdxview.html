<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Warlocks MDX viewer</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #070304; color: #f4dca0; font: 13px system-ui, sans-serif; }
