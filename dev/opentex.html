<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Open texture pack</title>
  <style>
    body { background: #222; color: #ddd; font: 12px system-ui, sans-serif; margin: 12px; }
    .grid { display: flex; flex-wrap: wrap; gap: 10px; }
    figure { margin: 0; width: 200px; }
    figure canvas { width: 200px; height: 200px; object-fit: contain; display: block;
      background: repeating-conic-gradient(#555 0 25%, #333 0 50%) 0 0 / 16px 16px; }
    figure.dark canvas { background: #000; }
    figcaption { word-break: break-all; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="grid" id="grid"></div>
  <script type="module" src="./opentex.ts"></script>
</body>
</html>
